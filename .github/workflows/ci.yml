name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"
  GITLEAKS_VERSION: "8.28.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  test:
    # No LLM calls and no live APIs: pytest blocks the network and replays cassettes only.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  generator:
    # `bench new` must render an integration that passes lint, types and its own tests.
    # Together the combinations use every template answer at least once.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dummy
            args: ""
          - name: oauthcursor
            args: -d auth=oauth_refresh -d pagination=cursor -d retry=gdrive -d error_format=slack
          - name: basicjira
            args: >-
              -d auth=basic -d pagination=next_page_token -d retry=jira -d error_format=jira
              -d base_url=https://bench.example.com/rest/api/3
          - name: longnameclient1
            args: >-
              -d auth=client_credentials -d pagination=page_token -d retry=github
              -d error_format=google -d "provider=Very Long Provider Name Thirty"
          - name: bearernext
            args: -d auth=bearer -d pagination=next_cursor -d error_format=error
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # copier clones the repo as its template; shallow clones warn
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - run: uv sync --locked
      - name: bench new (also runs uv sync and bench synth)
        run: uv run bench new ${{ matrix.name }} --defaults ${{ matrix.args }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest integrations/${{ matrix.name }}

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Pinned binary instead of gitleaks-action (Node 20, exit-code quirks, license check).
      - name: Install gitleaks
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL "$url" | tar -xz -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan history
        run: |
          gitleaks version
          gitleaks git --redact --verbose .
