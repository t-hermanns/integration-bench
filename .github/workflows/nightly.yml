name: nightly

# Gemini over all tasks with k=1, compared with the baseline in the bench-results branch
# (`bench regress`); a regression or a broken setup files (or comments on) an issue.
# The schedule only runs while the repo variable NIGHTLY_ENABLED is "true": every run
# costs ~190 of Gemini's 500 requests per day and leaves {run_id} objects in the sandbox.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      descriptions:
        description: Tool descriptions variant
        default: v2
      set_baseline:
        description: Make this run the new baseline
        type: boolean
        default: false

permissions:
  contents: write # push to bench-results
  issues: write

concurrency:
  group: live-sandbox
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.0"

jobs:
  regress:
    if: github.event_name != 'schedule' || vars.NIGHTLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JIRA_SITE: ${{ secrets.JIRA_SITE }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      # Secret names may not start with GITHUB_, hence GH_.
      GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
      GITHUB_INSTALLATION_ID: ${{ secrets.GH_INSTALLATION_ID }}
      GITHUB_PRIVATE_KEY: ${{ secrets.GH_PRIVATE_KEY }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Files the issues in this repo.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # commit range since the baseline
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - run: uv sync --locked
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: bench regress
        env:
          DESCRIPTIONS: ${{ inputs.descriptions || 'v2' }}
          SET_BASELINE: ${{ inputs.set_baseline && '--set-baseline' || '' }}
        run: uv run bench regress gemini --descriptions "$DESCRIPTIONS" $SET_BASELINE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-logs
          path: .bench/results/
          if-no-files-found: ignore
