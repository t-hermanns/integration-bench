[project]
name = "bench-evals"
version = "0.1.0"
description = "Eval harness for integration-bench: model adapters, runner, scorer and statistics."
requires-python = ">=3.13"
dependencies = [
    "bench-core",
    "httpx2>=2.13.1",
]

[tool.uv.sources]
bench-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"
