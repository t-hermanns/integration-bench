[project]
name = "bench-cli"
version = "0.1.0"
description = "The `bench` command line for integration-bench."
requires-python = ">=3.13"
dependencies = ["bench-core", "typer>=0.16"]

[project.scripts]
bench = "bench_cli.main:app"

[tool.uv.sources]
bench-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"
