[project]
name = "bench-core"
version = "0.1.0"
description = "Shared HTTP, auth, permissions, MCP and testing helpers for integration-bench."
requires-python = ">=3.13"
dependencies = [
    "httpx2>=2.13.1",
    "keyring>=25",
    "mcp>=2.3,<3",
    "pydantic>=2.14",
    "pyyaml>=6",
]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"
