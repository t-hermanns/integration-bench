# Tool descriptions v2, written after Anthropic's guide "Writing effective tools for
# agents": what each tool is for and when a sibling tool fits better, argument formats
# with examples, limits, the response shape, pagination and errors. Only text lives
# here; behaviour and argument types are in tools.py.
instructions: >-
  Tools for a Slack workspace: list public channels, read a channel's messages and
  threads, post messages and thread replies. There are no tools for direct messages,
  private channels, editing, deleting or reactions. Channels are addressed by id, not
  name: look the id up with slack_list_channels. Messages are addressed by their ts from
  a history result. List results come one page at a time; pass next_cursor back to get
  the next page.

tools:
  slack_list_channels:
    title: List channels
    description: >-
      List the workspace's public channels with id, name and is_member. Usually the
      first step: it turns a channel name like "#general" into the channel id the other
      tools need. is_member false means the app cannot read or post in that channel;
      say so instead of trying. When the result has a next_cursor, there are more
      channels: call again with that cursor until next_cursor is missing if you need
      all of them or have not found the channel yet.
    params:
      cursor: next_cursor from the previous result; omit for page one.
      page_size: Channels per page, 1-100 (default 50). Use the page size the user asks for.
      response_format: >-
        "concise" (default) for id, name and is_member; "detailed" adds topic, purpose
        and member count.

  slack_read_channel_history:
    title: Read channel history
    description: >-
      Read a channel's top-level messages, newest first: ts, author, text and, for
      messages with a thread, reply_count. Use it to find what was posted in a channel
      and to get the ts of a message you want to read the thread of or reply to. Thread
      replies are not included: to read them, pass the parent's ts to
      slack_read_thread. When the result has a next_cursor, older messages exist: call
      again with that cursor until you find the message or next_cursor is missing. A
      channel the app is not a member of returns a not_in_channel error; report that.
    params:
      channel_id: >-
        Channel id from slack_list_channels, e.g. "C0123456789" (not the name or
        "#name").
      cursor: next_cursor from the previous result for older messages; omit for the newest.
      page_size: >-
        Messages per page, 1-100 (default 20). Use the page size the user asks for.
      response_format: >-
        "concise" (default) for ts, author, text and thread info; "detailed" adds the
        posting time.

  slack_read_thread:
    title: Read thread
    description: >-
      Read one thread: the parent message followed by all its replies, oldest first.
      Use it for any question about replies or answers to a message. Needs the parent's
      ts: find the parent message (it has a reply_count) with
      slack_read_channel_history first. When the result has a next_cursor, the thread
      has more replies.
    params:
      channel_id: Channel id of the thread, e.g. "C0123456789".
      thread_ts: ts of the thread's parent message from a history result, e.g. "1727690000.123456".
      cursor: next_cursor from the previous result; omit for page one.
      page_size: Messages per page, 1-100 (default 50).
      response_format: >-
        "concise" (default) for ts, author, text; "detailed" adds the posting time.

  slack_post_message:
    title: Post message
    description: >-
      Post a new top-level message to a channel and return its ts. Use it for
      announcements and new topics. To answer, follow up on or reply to an existing
      message or question, use slack_reply_in_thread instead. The app must be a member
      of the channel (is_member in slack_list_channels); otherwise this fails with
      not_in_channel. It cannot message people directly: a person's name or user id is
      not a channel id, so for a direct message tell the user it is not possible.
    params:
      channel_id: Channel id from slack_list_channels, e.g. "C0123456789".
      text: >-
        Message text exactly as the user wants it (Slack mrkdwn, at most 4000
        characters).

  slack_reply_in_thread:
    title: Reply in thread
    description: >-
      Reply to an existing top-level message, in its thread, and return the reply's ts.
      Use it to answer a question or follow up on a message; for a new topic or
      announcement use slack_post_message. Needs the ts of the message being answered:
      find it with slack_read_channel_history first (for a reply to a thread, use the
      parent's ts, not a reply's).
    params:
      channel_id: Channel id of the message, e.g. "C0123456789".
      thread_ts: ts of the top-level message to reply to, from a history result.
      text: >-
        Reply text exactly as the user wants it (Slack mrkdwn, at most 4000
        characters).
