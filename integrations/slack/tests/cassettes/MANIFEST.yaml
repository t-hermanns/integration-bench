# Kind of every cassette in this directory. `bench synth` writes `synthetic` ones from
# the in-memory fake; `bench record` replaces them with `recorded` ones from the sandbox.
cassettes:
  list_channels: recorded
  list_channels_paged: recorded
  post_message: recorded
  post_message_forbidden: synthetic
  read_history: recorded
  read_history_missing_channel: recorded
  read_history_not_member: recorded
  read_thread: recorded
  read_thread_not_found: recorded
  reply_in_thread: recorded
  reply_thread_not_found: recorded
  reply_to_a_reply: recorded
