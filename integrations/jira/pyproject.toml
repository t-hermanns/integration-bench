[project]
name = "bench-jira"
version = "0.1.0"
description = "Jira MCP server for integration-bench."
requires-python = ">=3.13"
dependencies = ["bench-core"]

[project.scripts]
bench-jira = "bench_jira.server:main"

[tool.uv.sources]
bench-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"
