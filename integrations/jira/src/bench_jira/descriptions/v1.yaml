# Baseline tool descriptions (v1): short, in the style of OpenAPI summaries. The
# description experiment compares this against v2. Only text lives here; behaviour and
# argument types are in tools.py.
instructions: >-
  Tools for Jira Cloud issues. Search results come one page at a time; pass
  next_cursor back to get the next page.

tools:
  jira_search_issues:
    title: Search issues
    description: >-
      Search for issues using JQL (enhanced search).
    params:
      jql: JQL query, e.g. 'project = BENCH AND status = "In Progress"'.
      cursor: next_cursor from a previous call to get the next page; omit for page one.
      page_size: Results per page (1-50).
      response_format: >-
        "concise" (default) for key, summary, status and type; "detailed" adds
        priority, assignee, labels, last update and URL.

  jira_get_issue:
    title: Get issue
    description: >-
      Get an issue by key, including its description.
    params:
      issue_key: Issue key, e.g. "BENCH-12".
      response_format: >-
        "concise" (default) for the issue itself; "detailed" adds reporter, timestamps,
        URL and the comments.

  jira_create_issue:
    title: Create issue
    description: >-
      Create an issue in a project.
    params:
      project_key: Project key, e.g. "BENCH".
      summary: One-line summary (at most 255 characters).
      issue_type: Issue type name, e.g. "Task", "Bug" or "Story".
      description: Description in plain text.
      labels: Labels without spaces.

  jira_add_comment:
    title: Add comment
    description: >-
      Add a comment to an issue.
    params:
      issue_key: Issue key, e.g. "BENCH-12".
      body: Comment text in plain text.

  jira_transition_issue:
    title: Transition issue
    description: >-
      Move an issue to another workflow status.
    params:
      issue_key: Issue key, e.g. "BENCH-12".
      status: Target status, e.g. "In Progress" or "Done".
