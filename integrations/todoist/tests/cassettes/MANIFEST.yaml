# Kind of every cassette in this directory. `bench synth` writes `synthetic` ones from
# the in-memory fake; `bench record` replaces them with `recorded` ones from the sandbox.
cassettes:
  create_task: recorded
  create_task_forbidden: synthetic
  create_task_invalid: recorded
  get_task: recorded
  get_task_not_found: recorded
  list_no_results: recorded
  list_tasks: recorded
