# Baseline tool descriptions (v1). The description experiment compares this against v2.
# Only text lives here; behaviour and argument types are in tools.py.
instructions: >-
  Tools for Todoist tasks. List results come one page at a time; pass next_cursor
  back to get the next page.

tools:
  todoist_list_tasks:
    title: List tasks
    description: >-
      List tasks (open ones only), optionally those whose title contains a search text.
    params:
      query: Text the task title must contain; omit to list all tasks.
      cursor: next_cursor from a previous call to get the next page; omit for page one.
      page_size: Results per page (1-50).
      response_format: >-
        "concise" (default) for id, title and status; "detailed" adds the description,
        timestamps and URL.

  todoist_get_task:
    title: Get task
    description: >-
      Get one task by id, including its description.
    params:
      task_id: Task id from a list result, e.g. "6hjQfxpQR48VffMV".
      response_format: >-
        "concise" (default) for the task itself; "detailed" adds timestamps and URL.

  todoist_create_task:
    title: Create task
    description: >-
      Create a new task.
    params:
      title: Task title (at most 200 characters).
      description: Task description in plain text.
