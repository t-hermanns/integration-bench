# Kind of every cassette in this directory. `bench synth` writes `synthetic` ones from
# the in-memory fake; `bench record` replaces them with `recorded` ones from the sandbox.
cassettes:
  add_issue_comment: recorded
  create_issue: recorded
  create_issue_forbidden: synthetic
  get_binary_file: recorded
  get_directory: recorded
  get_file: recorded
  get_file_not_found: recorded
  get_file_with_space: recorded
  get_issue: recorded
  get_issue_not_found: recorded
  get_large_file: recorded
  list_issue_comments: recorded
  list_pull_requests: recorded
  search_issues: recorded
  search_no_results: recorded
  search_unknown_user: recorded
